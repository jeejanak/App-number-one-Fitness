name: Daily Excel Rebuild (never deletes)
on:
  schedule:
    - cron: '0 0 * * *' # daily 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/users.json']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install exceljs --no-save
      - run: node scripts/generate-excel.js
      - run: |
          git config user.name "momentum-bot"
          git config user.email "bot@momentum.local"
          git add docs/Momentum_Users.xlsx data/users.json || true
          git diff --staged --quiet || git commit -m "chore: rebuild Excel — date-wise tabs, never delete [skip ci]"
          git push || true
